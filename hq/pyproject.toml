[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ajax-hq"
version = "0.1.0"
description = "Ajax HQ — agent operations centre"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ajax-hq = "ajax_hq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `typer.Option(...)` in a default IS Typer's documented API — the call
# result is the parameter spec, not a mutable default. Not a defect here.
# UP042: `str, Enum` is deliberate; those values are serialized to JSON.
ignore = ["E501", "UP042", "B008"]
