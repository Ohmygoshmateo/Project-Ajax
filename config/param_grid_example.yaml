# Parameter grid for `ajax tune`. Every listed key is swept over its values;
# the tuner reports in-sample and holdout metrics side by side.
#
# hold_trading_days is deliberately absent — 5 days is a requirement, not a
# parameter.
signals.entry_score_threshold: [0.5, 0.75, 1.0]
options.delta_min: [0.45, 0.55]
options.delta_max: [0.60, 0.70]
options.dte_target_min: [25, 30]
options.dte_target_max: [40, 45]
backtest.vol_haircut_points: [0.0, 3.5]
