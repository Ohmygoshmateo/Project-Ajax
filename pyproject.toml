[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ajax"
version = "0.1.0"
description = "S&P 500 options swing-trade scanner, backtester, and paper-trading agent"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.21",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas_market_calendars>=4.3",
    "pyarrow>=14.0",
    "typer>=0.12",
    "rich>=13.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "freezegun>=1.4",
    "ruff>=0.3",
]

[project.scripts]
ajax = "ajax.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ajax = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: `str, Enum` is deliberate — these values are persisted to sqlite and
# JSON, and the str mixin keeps that serialization stable across versions.
ignore = ["E501", "UP042"]
